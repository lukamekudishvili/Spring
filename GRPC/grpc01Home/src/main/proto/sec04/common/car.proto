syntax = "proto3";

package proto.sec04.common;

option java_package = "com.lukaCode.generatedModel.sec04.common";
option java_multiple_files = true;

enum BodyStyle{
  UNKNOWN=0;
  SEDAN=1;
  COUPE=2;
  SUV=3;
}

message Car{
  string make =1;
  string model =2;
  int32 year=3;
  BodyStyle body_style=4;
}