spring.application.name=spring-recipe-app
logging.level.root=WARN
spring.main.banner-mode=off
spring.jpa.defer-datasource-initialization=true

# Use a named, in-memory database instead of a random one
spring.datasource.url=jdbc:h2:mem:testdb

# Optional: keep DB alive even after app context closes (great for debugging)
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.initialization-mode=always

# Enable H2 web console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console